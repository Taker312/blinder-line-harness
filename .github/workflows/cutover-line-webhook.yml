name: Cut Over LINE Webhook

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SWITCH to replace the current production webhook
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/cutover-line-webhook.trigger'

jobs:
  cutover:
    if: github.event_name == 'push' || inputs.confirmation == 'SWITCH'
    runs-on: ubuntu-latest
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      NEW_WEBHOOK_URL: https://blinder-line-harness.blinder-taker312.workers.dev/webhook

    steps:
      - name: Cut over with automatic rollback
        run: |
          set -euo pipefail
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"

          auth_header="Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN"
          current="$(curl --fail --silent --show-error \
            --header "$auth_header" \
            https://api.line.me/v2/bot/channel/webhook/endpoint)"
          old_endpoint="$(printf '%s' "$current" | jq -r '.endpoint // empty')"
          test -n "$old_endpoint"

          sql_file="$(mktemp)"
          OLD_ENDPOINT="$old_endpoint" SQL_FILE="$sql_file" node <<'NODE'
          const fs = require('node:fs');
          const q = (value) => "'" + String(value).replaceAll("'", "''") + "'";
          const sql = `
          CREATE TABLE IF NOT EXISTS deployment_state (
            key TEXT PRIMARY KEY,
            value TEXT NOT NULL,
            updated_at TEXT NOT NULL DEFAULT (datetime('now'))
          );
          INSERT INTO deployment_state (key, value, updated_at)
          VALUES ('previous_line_webhook_url', ${q(process.env.OLD_ENDPOINT)}, datetime('now'))
          ON CONFLICT(key) DO UPDATE SET value = excluded.value, updated_at = datetime('now');
          `;
          fs.writeFileSync(process.env.SQL_FILE, sql, { mode: 0o600 });
          NODE
          npx --yes wrangler@4.77.0 d1 execute "$D1_DATABASE_NAME" --remote --file="$sql_file" >/dev/null
          rm -f "$sql_file"

          direct_test="$(curl --fail --silent --show-error \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg endpoint "$NEW_WEBHOOK_URL" '{endpoint: $endpoint}')" \
            https://api.line.me/v2/bot/channel/webhook/test)"
          printf '%s' "$direct_test" | jq -e '.success == true' >/dev/null

          curl --fail --silent --show-error \
            --request PUT \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg endpoint "$NEW_WEBHOOK_URL" '{endpoint: $endpoint}')" \
            https://api.line.me/v2/bot/channel/webhook/endpoint >/dev/null

          switched=false
          for attempt in $(seq 1 12); do
            configured="$(curl --fail --silent --show-error \
              --header "$auth_header" \
              https://api.line.me/v2/bot/channel/webhook/endpoint \
              | jq -r '.endpoint // empty')"
            if [ "$configured" = "$NEW_WEBHOOK_URL" ]; then
              switched=true
              break
            fi
            sleep 5
          done

          if [ "$switched" != "true" ]; then
            curl --fail --silent --show-error \
              --request PUT \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data "$(jq -n --arg endpoint "$old_endpoint" '{endpoint: $endpoint}')" \
              https://api.line.me/v2/bot/channel/webhook/endpoint >/dev/null
            echo "Cutover verification failed; the previous webhook was restored."
            exit 1
          fi

          echo "LINE webhook cutover completed and verified."
