name: Roll Back LINE Webhook

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROLLBACK to restore the previously saved webhook
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/rollback-line-webhook.trigger'

jobs:
  rollback:
    if: github.event_name == 'push' || inputs.confirmation == 'ROLLBACK'
    runs-on: ubuntu-latest
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}

    steps:
      - name: Restore previous webhook
        run: |
          set -euo pipefail
          result="$(npx --yes wrangler@4.77.0 d1 execute "$D1_DATABASE_NAME" --remote --json \
            --command "SELECT value FROM deployment_state WHERE key='previous_line_webhook_url' LIMIT 1")"
          previous="$(printf '%s' "$result" | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const data = JSON.parse(s);
              process.stdout.write(data[0]?.results?.[0]?.value || "");
            });
          ')"
          test -n "$previous"

          auth_header="Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN"
          curl --fail --silent --show-error \
            --request PUT \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg endpoint "$previous" '{endpoint: $endpoint}')" \
            https://api.line.me/v2/bot/channel/webhook/endpoint >/dev/null

          configured="$(curl --fail --silent --show-error \
            --header "$auth_header" \
            https://api.line.me/v2/bot/channel/webhook/endpoint \
            | jq -r '.endpoint // empty')"
          test "$configured" = "$previous"
          echo "Previous LINE webhook restored."
