name: Setup Blinder Cloudflare Resources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/setup-blinder-cloudflare.yml

jobs:
  setup-d1:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find or create production D1
        shell: bash
        run: |
          set -euo pipefail

          find_database_id() {
            npx --yes wrangler@3.114.17 d1 list --json | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const databases = JSON.parse(input);
                const database = databases.find(item => item.name === "blinder-line-harness");
                if (database) process.stdout.write(database.uuid || database.id || "");
              });
            '
          }

          database_id="$(find_database_id)"
          if [ -z "$database_id" ]; then
            npx --yes wrangler@3.114.17 d1 create blinder-line-harness --location apac
            database_id="$(find_database_id)"
          fi

          if [ -z "$database_id" ]; then
            echo "D1 database ID could not be resolved." >&2
            exit 1
          fi

          echo "D1_DATABASE_NAME=blinder-line-harness"
          echo "D1_DATABASE_ID=$database_id"
