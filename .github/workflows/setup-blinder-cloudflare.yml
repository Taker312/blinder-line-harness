name: Setup Blinder Cloudflare Resources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/setup-blinder-cloudflare.yml

jobs:
  setup-d1:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find or create production D1
        shell: bash
        run: |
          set -euo pipefail

          find_database_id() {
            npx --yes wrangler@3.114.17 d1 list --json | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const databases = JSON.parse(input);
                const database = databases.find(item => item.name === "blinder-line-harness");
                if (database) process.stdout.write(database.uuid || database.id || "");
              });
            '
          }

          database_id="$(find_database_id)"
          if [ -z "$database_id" ]; then
            npx --yes wrangler@3.114.17 d1 create blinder-line-harness --location apac
            database_id="$(find_database_id)"
          fi

          if [ -z "$database_id" ]; then
            echo "D1 database ID could not be resolved." >&2
            exit 1
          fi

          echo "D1_DATABASE_NAME=blinder-line-harness"
          echo "D1_DATABASE_ID=$database_id"

      - name: Find or create image bucket
        shell: bash
        run: |
          set -euo pipefail
          buckets="$(npx --yes wrangler@4.77.0 r2 bucket list)"
          if ! printf '%s\n' "$buckets" | grep -Fq "line-harness-images"; then
            npx --yes wrangler@4.77.0 r2 bucket create line-harness-images --location apac
          fi
          echo "R2_BUCKET_NAME=line-harness-images"

      - name: Find or create admin Pages project
        shell: bash
        run: |
          set -euo pipefail
          projects="$(npx --yes wrangler@4.77.0 pages project list --json)"
          exists="$(printf '%s' "$projects" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const projects = JSON.parse(input);
              const exists = projects.some(item => item.name === "blinder-line-harness-admin");
              process.stdout.write(exists ? "yes" : "no");
            });
          ')"
          if [ "$exists" != "yes" ]; then
            npx --yes wrangler@4.77.0 pages project create blinder-line-harness-admin --production-branch main
          fi
          echo "PAGES_PROJECT_NAME=blinder-line-harness-admin"
