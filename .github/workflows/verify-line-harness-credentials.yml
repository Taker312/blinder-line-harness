name: Verify LINE Harness Credentials

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-line-harness-credentials.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      API_KEY: ${{ secrets.API_KEY }}
      WORKER_URL: https://blinder-line-harness.blinder-taker312.workers.dev
      ADMIN_URL: https://blinder-line-harness-admin.pages.dev

    steps:
      - name: Verify LINE Messaging API token
        run: |
          set -euo pipefail
          test -n "$LINE_CHANNEL_ACCESS_TOKEN"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            https://api.line.me/v2/bot/info)"
          test "$status" = "200"
          jq -e '.userId and .basicId and .displayName' "$response_file" >/dev/null
          rm -f "$response_file"
          echo "LINE Messaging API token is valid."

      - name: Verify admin login
        run: |
          set -euo pipefail
          test -n "$API_KEY"
          payload="$(jq -n --arg apiKey "$API_KEY" '{apiKey: $apiKey}')"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Origin: $ADMIN_URL" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$WORKER_URL/api/auth/login")"
          test "$status" = "200"
          jq -e '.success == true and .data.role == "owner"' "$response_file" >/dev/null
          rm -f "$response_file"
          echo "Admin API key and cross-site login are valid."
